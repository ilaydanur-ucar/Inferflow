services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    ports:
      - "9000:9000"
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - HOST=0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
